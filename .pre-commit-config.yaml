repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.idea/
      - id: end-of-file-fixer
        exclude: ^\.idea/
      - id: check-yaml
        exclude: ^\.idea/
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.1
    hooks:
      - id: pyupgrade
        args: [--py313-plus]

  - repo: local
    hooks:
      - id: format
        name: ruff
        entry: poetry run task executar_ruff
        language: system
        types: [python]
        pass_filenames: false
