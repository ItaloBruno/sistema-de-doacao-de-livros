{% extends "base.html" %}

{% block titulo %}Registrar - Sistema de doação de livros{% endblock %}

{% block conteudo %}
<div class="min-h-screen py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl mx-auto">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-stone-900">
                Criar uma conta
            </h2>
            <p class="mt-2 text-sm text-stone-600">
                Já tem uma conta?
                <a href="/entrar" class="font-medium text-amber-700 hover:text-amber-800">
                    Entrar
                </a>
            </p>
        </div>
        
        <div id="mensagem-erro" class="hidden rounded-md bg-red-50 p-4 mb-6">
            <div class="flex">
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-red-800" id="texto-erro"></h3>
                </div>
            </div>
        </div>
        
        <div class="bg-stone-50 shadow rounded-lg p-6 mb-6 border border-stone-300">
            <h3 class="text-lg font-medium text-stone-900 mb-4">Tipo de cadastro</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button
                    type="button"
                    id="btn-doador"
                    class="tipo-usuario-btn border-2 border-amber-700 bg-amber-700 text-white rounded-lg p-4 hover:bg-amber-800 transition"
                    onclick="selecionarTipo('doador')"
                >
                    <div class="text-center">
                        <h4 class="font-semibold text-lg">Doador</h4>
                        <p class="text-sm mt-1">Quero doar livros</p>
                    </div>
                </button>
                <button
                    type="button"
                    id="btn-instituicao"
                    class="tipo-usuario-btn border-2 border-stone-300 text-stone-700 rounded-lg p-4 hover:border-amber-700 transition"
                    onclick="selecionarTipo('instituicao')"
                >
                    <div class="text-center">
                        <h4 class="font-semibold text-lg">Instituição</h4>
                        <p class="text-sm mt-1">Quero receber doações</p>
                    </div>
                </button>
            </div>
        </div>
        
        <form id="form-doador" class="bg-stone-50 shadow rounded-lg p-6 space-y-4 border border-stone-300">
            <h3 class="text-lg font-medium text-stone-900 mb-4">Dados do Doador</h3>
            
            <div>
                <label for="doador-nome" class="block text-sm font-medium text-stone-700">Nome completo</label>
                <input
                    type="text"
                    id="doador-nome"
                    required
                    class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500"
                >
            </div>
            
            <div>
                <label for="doador-email" class="block text-sm font-medium text-stone-700">Email</label>
                <input
                    type="email"
                    id="doador-email"
                    required
                    class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500"
                >
            </div>
            
            <div>
                <label for="doador-telefone" class="block text-sm font-medium text-stone-700">Telefone</label>
                <input
                    type="tel"
                    id="doador-telefone"
                    required
                    placeholder="(11) 98765-4321"
                    class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500"
                >
            </div>
            
            <div>
                <label for="doador-senha" class="block text-sm font-medium text-stone-700">Senha</label>
                <input
                    type="password"
                    id="doador-senha"
                    required
                    minlength="6"
                    class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500"
                >
            </div>
            
            <div class="pt-4">
                <button
                    type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-emerald-700 hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500"
                >
                    Criar conta
                </button>
            </div>
        </form>
        
        <form id="form-instituicao" class="bg-stone-50 shadow rounded-lg p-6 space-y-4 hidden border border-stone-300">
            <h3 class="text-lg font-medium text-stone-900 mb-4">Dados da Instituição</h3>
            
            <div>
                <label for="inst-nome" class="block text-sm font-medium text-stone-700">Nome da instituição</label>
                <input
                    type="text"
                    id="inst-nome"
                    class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500"
                >
            </div>
            
            <div>
                <label for="inst-email" class="block text-sm font-medium text-stone-700">Email</label>
                <input
                    type="email"
                    id="inst-email"
                    class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500"
                >
            </div>
            
            <div>
                <label for="inst-senha" class="block text-sm font-medium text-stone-700">Senha</label>
                <input
                    type="password"
                    id="inst-senha"
                    minlength="6"
                    class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500"
                >
            </div>
            
            <div>
                <label for="inst-descricao" class="block text-sm font-medium text-stone-700">Descrição</label>
                <textarea
                    id="inst-descricao"
                    rows="3"
                    class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500"
                ></textarea>
            </div>
            
            <div>
                <label for="inst-data-fundacao" class="block text-sm font-medium text-stone-700">Data de fundação</label>
                <input
                    type="date"
                    id="inst-data-fundacao"
                    class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500"
                >
            </div>
            
            <div>
                <label for="inst-endereco" class="block text-sm font-medium text-stone-700">Endereço</label>
                <input
                    type="text"
                    id="inst-endereco"
                    class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500"
                >
            </div>
            
            <div>
                <label for="inst-site" class="block text-sm font-medium text-stone-700">Site (opcional)</label>
                <input
                    type="url"
                    id="inst-site"
                    placeholder="https://exemplo.com"
                    class="mt-1 block w-full px-3 py-2 border border-stone-300 rounded-md shadow-sm focus:outline-none focus:ring-amber-500 focus:border-amber-500"
                >
            </div>
            
            <div class="pt-4">
                <button
                    type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-emerald-700 hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500"
                >
                    Criar conta
                </button>
            </div>
        </form>
        
        <div class="text-center mt-6">
            <a href="/" class="text-sm text-amber-700 hover:text-amber-800">
                Voltar para a página inicial
            </a>
        </div>
    </div>
</div>

<script>
let tipoSelecionado = 'doador';

function selecionarTipo(tipo) {
    tipoSelecionado = tipo;
    
    const btnDoador = document.getElementById('btn-doador');
    const btnInstituicao = document.getElementById('btn-instituicao');
    const formDoador = document.getElementById('form-doador');
    const formInstituicao = document.getElementById('form-instituicao');
    
    if (tipo === 'doador') {
        btnDoador.className = 'tipo-usuario-btn border-2 border-amber-700 bg-amber-700 text-white rounded-lg p-4 hover:bg-amber-800 transition';
        btnInstituicao.className = 'tipo-usuario-btn border-2 border-stone-300 text-stone-700 rounded-lg p-4 hover:border-amber-700 transition';
        formDoador.classList.remove('hidden');
        formInstituicao.classList.add('hidden');
    } else {
        btnDoador.className = 'tipo-usuario-btn border-2 border-stone-300 text-stone-700 rounded-lg p-4 hover:border-amber-700 transition';
        btnInstituicao.className = 'tipo-usuario-btn border-2 border-amber-700 bg-amber-700 text-white rounded-lg p-4 hover:bg-amber-800 transition';
        formDoador.classList.add('hidden');
        formInstituicao.classList.remove('hidden');
    }
}

document.getElementById('form-doador').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const dados = {
        nome: document.getElementById('doador-nome').value,
        email: document.getElementById('doador-email').value,
        telefone: document.getElementById('doador-telefone').value,
        senha: document.getElementById('doador-senha').value,
    };
    
    try {
        const response = await fetch('/api/doadores', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(dados),
        });
        
        const data = await response.json();
        
        if (response.ok) {
            alert('Conta criada com sucesso! Faça login para continuar.');
            window.location.href = '/entrar';
        } else {
            document.getElementById('texto-erro').textContent = data.detail || 'Erro ao criar conta';
            document.getElementById('mensagem-erro').classList.remove('hidden');
        }
    } catch (error) {
        document.getElementById('texto-erro').textContent = 'Erro ao conectar com o servidor';
        document.getElementById('mensagem-erro').classList.remove('hidden');
    }
});

document.getElementById('form-instituicao').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const dados = {
        nome: document.getElementById('inst-nome').value,
        email: document.getElementById('inst-email').value,
        senha: document.getElementById('inst-senha').value,
        descricao: document.getElementById('inst-descricao').value,
        data_fundacao: document.getElementById('inst-data-fundacao').value,
        endereco: document.getElementById('inst-endereco').value,
        site: document.getElementById('inst-site').value || null,
    };
    
    try {
        const response = await fetch('/api/instituicoes', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(dados),
        });
        
        const data = await response.json();
        
        if (response.ok) {
            alert('Conta criada com sucesso! Faça login para continuar.');
            window.location.href = '/entrar';
        } else {
            document.getElementById('texto-erro').textContent = data.detail || 'Erro ao criar conta';
            document.getElementById('mensagem-erro').classList.remove('hidden');
        }
    } catch (error) {
        document.getElementById('texto-erro').textContent = 'Erro ao conectar com o servidor';
        document.getElementById('mensagem-erro').classList.remove('hidden');
    }
});
</script>
{% endblock %}
