{% extends "base.html" %}

{% block titulo %}Instituições - Sistema de doação de livros{% endblock %}

{% block conteudo %}
<div class="w-full min-h-screen">
    <header class="border-b border-gray-200">
        <div class="mx-auto max-w-[1216px] px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <h1 class="text-xl sm:text-2xl font-semibold text-gray-900">
                <a href="/">Sistema de doação de livros</a>
            </h1>
            <div id="header-nav">
                <a href="/entrar" class="text-sm text-indigo-600 hover:text-indigo-500">Entrar</a>
            </div>
        </div>
    </header>

    <main class="mx-auto max-w-[1216px] px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-900">Instituições Sociais</h2>
            <p class="mt-2 text-gray-700">Escolha uma instituição para fazer sua doação de livros</p>
        </div>

        <div id="loading" class="text-center py-12">
            <p class="text-gray-600">Carregando instituições...</p>
        </div>

        <div id="lista-instituicoes" class="space-y-6 hidden"></div>

        <div id="paginacao" class="mt-8 flex justify-center gap-2 hidden"></div>
    </main>
</div>

<script>
let usuario = null;
let paginaAtual = 1;
const tamanhoPagina = 10;

function verificarAutenticacao() {
    const usuarioStr = sessionStorage.getItem('usuario');
    const headerNav = document.getElementById('header-nav');
    
    if (!usuarioStr) {
        headerNav.innerHTML = '<a href="/entrar" class="text-sm text-indigo-600 hover:text-indigo-500">Entrar</a>';
        return;
    }
    
    usuario = JSON.parse(usuarioStr);
    
    if (usuario.tipo === 'doador') {
        headerNav.innerHTML = `
            <div class="flex items-center gap-4">
                <span class="text-sm text-gray-700">Olá, <strong>${usuario.nome}</strong></span>
                <button onclick="sair()" class="text-sm text-indigo-600 hover:text-indigo-500">Sair</button>
            </div>
        `;
    } else {
        headerNav.innerHTML = '<a href="/entrar" class="text-sm text-indigo-600 hover:text-indigo-500">Entrar</a>';
    }
}

function sair() {
    sessionStorage.removeItem('usuario');
    window.location.href = '/';
}

async function carregarInstituicoes(pagina = 1) {
    try {
        const response = await fetch(`/api/instituicoes?pagina=${pagina}&tamanho_pagina=${tamanhoPagina}`);
        const data = await response.json();
        
        if (response.ok) {
            exibirInstituicoes(data.instituicoes);
            exibirPaginacao(data.pagina, Math.ceil(data.total / data.tamanho_pagina));
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('lista-instituicoes').classList.remove('hidden');
            document.getElementById('paginacao').classList.remove('hidden');
        }
    } catch (error) {
        document.getElementById('loading').innerHTML = '<p class="text-red-600">Erro ao carregar instituições</p>';
    }
}

function exibirInstituicoes(instituicoes) {
    const lista = document.getElementById('lista-instituicoes');
    lista.innerHTML = '';
    
    instituicoes.forEach(inst => {
        const dataFundacao = new Date(inst.data_fundacao).toLocaleDateString('pt-BR');
        const dataRegistro = new Date(inst.data_registro).toLocaleDateString('pt-BR');
        
        const card = document.createElement('div');
        card.className = 'bg-white rounded-lg border border-gray-200 p-6 hover:shadow-lg transition';
        card.innerHTML = `
            <div class="flex flex-col md:flex-row gap-6">
                <div class="flex-shrink-0">
                    <div class="w-32 h-32 bg-gray-200 rounded-lg flex items-center justify-center">
                        ${inst.foto_url ? 
                            `<img src="${inst.foto_url}" alt="${inst.nome}" class="w-full h-full object-cover rounded-lg">` :
                            '<span class="text-gray-400 text-4xl">📚</span>'
                        }
                    </div>
                </div>
                <div class="flex-1">
                    <h3 class="text-xl font-semibold text-gray-900">${inst.nome}</h3>
                    <p class="mt-2 text-gray-700">${inst.descricao}</p>
                    <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm text-gray-600">
                        <p><strong>Data de fundação:</strong> ${dataFundacao}</p>
                        <p><strong>Registrado em:</strong> ${dataRegistro}</p>
                        <p><strong>Livros recebidos:</strong> ${inst.livros_recebidos}</p>
                        <p><strong>Endereço:</strong> ${inst.endereco}</p>
                        ${inst.site ? `<p><strong>Site:</strong> <a href="${inst.site}" target="_blank" class="text-indigo-600 hover:text-indigo-500">${inst.site}</a></p>` : ''}
                    </div>
                    <div class="mt-4">
                        <a href="/instituicoes/${inst.id}/doacao" class="inline-block rounded-md bg-indigo-600 px-4 py-2 text-white font-medium hover:bg-indigo-700">
                            Fazer doação
                        </a>
                    </div>
                </div>
            </div>
        `;
        lista.appendChild(card);
    });
}

function exibirPaginacao(paginaAtual, totalPaginas) {
    const paginacao = document.getElementById('paginacao');
    paginacao.innerHTML = '';
    
    if (totalPaginas <= 1) return;
    
    if (paginaAtual > 1) {
        const btnPrev = document.createElement('button');
        btnPrev.textContent = 'Anterior';
        btnPrev.className = 'px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50';
        btnPrev.onclick = () => {
            carregarInstituicoes(paginaAtual - 1);
            window.scrollTo(0, 0);
        };
        paginacao.appendChild(btnPrev);
    }
    
    for (let i = 1; i <= totalPaginas; i++) {
        if (i === 1 || i === totalPaginas || (i >= paginaAtual - 2 && i <= paginaAtual + 2)) {
            const btnPage = document.createElement('button');
            btnPage.textContent = i;
            btnPage.className = i === paginaAtual ?
                'px-4 py-2 bg-indigo-600 text-white rounded-md' :
                'px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50';
            btnPage.onclick = () => {
                carregarInstituicoes(i);
                window.scrollTo(0, 0);
            };
            paginacao.appendChild(btnPage);
        } else if (i === paginaAtual - 3 || i === paginaAtual + 3) {
            const span = document.createElement('span');
            span.textContent = '...';
            span.className = 'px-2 py-2';
            paginacao.appendChild(span);
        }
    }
    
    if (paginaAtual < totalPaginas) {
        const btnNext = document.createElement('button');
        btnNext.textContent = 'Próxima';
        btnNext.className = 'px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50';
        btnNext.onclick = () => {
            carregarInstituicoes(paginaAtual + 1);
            window.scrollTo(0, 0);
        };
        paginacao.appendChild(btnNext);
    }
}

verificarAutenticacao();
carregarInstituicoes();
</script>
{% endblock %}
