[project]
name = "sistema-de-doacao-de-livros"
version = "0.1.0"
description = "Sistema de doação de livros"
authors = [
    {name = "ItaloBruno",email = "rt.italo.bruno.silva@gmail.com"},
    {name = "RafaelCoelho", email = "rafaellcoellho@gmail.com"}
]
readme = "README.md"
requires-python = "==3.13"
dependencies = [
    "fastapi[standard]==0.119.0",
    "sqlalchemy==2.0.45",
    "psycopg2-binary==2.9.11",
    "argon2-cffi==23.1.0",
    "pyjwt (==2.10.1)"
]


[build-system]
requires = ["poetry-core==2.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "taskipy==1.14.1",
    "ruff==0.14.0",
    "pre-commit==4.5.1",
]

[tool.taskipy.tasks]
executar_ruff = 'bash scripts/executar_ruff.sh'
executar_pyright = 'bash scripts/executar_pyright.sh'
executar_servidor_dev = 'bash scripts/executar_servidor_dev.sh'
executar_docker_compose_testes = 'docker compose -f docker-compose.testes.yml up'
executar_pytest = 'bash scripts/executar_pytest.sh'

[tool.poetry]
package-mode = false
